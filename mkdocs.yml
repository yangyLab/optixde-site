site_name: OptiXDE
site_description: A fast optical-inspired solver for differential equations
site_url: https://yangylab.github.io/optixde-site/
repo_url: https://github.com/yangylab/optixde-site
repo_name: OptiXDE Site
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/hero.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Method: method.md
  - Benchmarks: benchmarks.md
  - API:
      - Overview: api/index.md
      - Conventions & diagnostics: api/conventions.md
      - FFT backends: api/backends.md
      - Spectral operators: api/operators.md
      - Geometry & boundary conditions: api/geometry-boundaries.md
      - Elliptic solvers: api/elliptic.md
      - Evolution equations: api/evolution.md
      - Flow solvers: api/flows.md
      - Embedded domains: api/embedded.md
      - Post-processing: api/postprocessing.md
  - FAQ: faq.md
  - Cite & Contact: cite.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yangylab
